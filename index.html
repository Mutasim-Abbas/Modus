<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="theme-color" content="#12131c" />

    <title>Modus — Nutrition Tracker</title>
    <meta
      name="description"
      content="Track calories and macros with a real Mifflin-St Jeor macro engine and a curated food database. No account needed — your data stays on your device, and syncs only if you choose to sign in."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Modus — Nutrition Tracker" />
    <meta
      property="og:description"
      content="Track calories and macros with a real Mifflin-St Jeor macro engine and a curated food database. No account needed — your data stays on your device, and syncs only if you choose to sign in."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Modus — Nutrition Tracker" />
    <meta
      name="twitter:description"
      content="Track calories and macros with a real macro engine and a curated food database. Works offline; sync is optional."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Sora carries the UI, JetBrains Mono carries every number (see --fm-font-num). The two
      are requested in one stylesheet so this stays a single render-blocking request rather
      than two. Manrope is kept as the first fallback: it was the previous UI face, so a
      cached copy renders something correct while Sora arrives.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Modus needs JavaScript enabled to track your macros.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
